name = "downloader-anything"
main = "src/index.ts"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

# Assets for serving frontend directly from Worker (optional, Pages is primary)
# [assets]
# directory = "./frontend"
# not_found_handling = "single-page-application"

[vars]
# yt-dlp server for full site support (SoundCloud etc). YouTube bot-blocked on datacenter, use local for YT.
# Render Singapore (free, Docker + ffmpeg) — works for SoundCloud/TikTok* etc; YT needs residential IP/local
YT_DLP_API_URL = "https://downloader-anything-yt-dlp.onrender.com"

# CORS - set to your Pages domain in production
ALLOWED_ORIGIN = "*"

[observability]
enabled = true
